# House-lights build environments (arjohnson15/WLED fork, branch v16-house).
# This file is gitignored by upstream WLED and force-added here on purpose:
# platformio.ini stays byte-identical to upstream so merging upstream stays cheap.
#
# Base: upstream tag v16.0.1 on WLED's default ESP32 platform (esp32_idf_V4 = Tasmota
# platform-espressif32 2024.06.00, arduino-esp32 2.0.18 / esp-idf 4.4.8). That is the exact
# combination QuinLED's own released firmware for the Dig-Quad is built on, and the one Andrew
# has confirmed on his hardware drives all four outputs correctly (2026-09-12). The previous
# base, upstream main (17.0.0-devV5), had a WS2812/RMT bug on IDF5 and WiFi problems on IDF4.

[platformio]
default_envs = house_esp32

# Target: QuinLED Dig-Quad-AE v2 pre-assembled (QuinLED-ESP32 module, ESP32-WROOM-32E, 4 MB flash).
# Classic ESP32: upstream esp32dev plus the two house usermods.
[env:house_esp32]
extends = env:esp32dev
custom_usermods = DirectAuth CloudLink
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"HOUSE_ESP32\"
              -DARDUINO_USB_CDC_ON_BOOT=0
              -D WLED_DISABLE_INFRARED
              -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_LOXONE -D WLED_DISABLE_PIXELFORGE -D WLED_DISABLE_PARTICLESYSTEM2D
              -D WLED_DISABLE_ALEXA
              -D JTS_BUILD='"${UNIX_TIME}"'   ;; build id reported to the cloud, used to compare releases
              ;; QuinLED Dig-Quad v2/v3 first-boot defaults (all runtime-changeable in LED settings):
              ;; LED1=GPIO16 LED2=GPIO3 LED3=GPIO1 LED4=GPIO4, button=GPIO0, Q1R strip-power relay=GPIO15
              ;; (fitted on pre-assembled boards such as Andrew's Dig-Quad-AE v2; set -1 in the UI on a DIY board).
              ;; Temp sensor is GPIO13 (Temperature usermod, not included).
              -D DATA_PINS=16,3,1,4 -D PIXEL_COUNTS=30,30,30,30 -D BTNPIN=0 -D RLYPIN=15
              ;; parity with QuinLED's own Dig-Quad build flags (intermittech/QuinLED-Firmware
              ;; platformio_override.ini, build_flags_dig_quad): allow WiFi modem sleep, 1250 mA default budget
              -D NOWIFISLEEP=false -D ABL_MILLIAMPS_DEFAULT=1250
# CloudLink + TLS is ~1.67 MB; the stock 4MB_1MB_FS 1.5 MB app slot overflows, so use the 1.8 MB one.
board_build.partitions = ${esp32.big_partitions}
# firmware.factory.bin (bootloader + partitions + boot_app0 + app, flashable at 0x0) for the panel's
# "USB flash image" button and jts-firmware.yml.
extra_scripts = ${scripts_defaults.extra_scripts}
  post:tools/jts-merge-factory.py
# 2026-09-14: TLS for CloudLink on this (Tasmota, IDF4.4.8) package, whose precompiled libs were
# built with CONFIG_MBEDTLS_TLS_DISABLED: lib/idf4_tls_from_source supplies the ssl layer, the EC
# crypto the same sdkconfig switched off, esp-tls and tcp_transport, all from the mbedtls commit
# IDF 4.4.8 pins, compiled against this package's own esp_config.h. Opt-in per env; its guard
# refuses any package that already has TLS. See lib/idf4_tls_from_source/README.md.
lib_deps = ${esp32_idf_V4.lib_deps}
  idf4_tls_from_source

# Link-testable variant while the TLS library CloudLink needs is still being produced: the Tasmota
# platform's precompiled libs ship no mbedtls_ssl_*, so house_esp32 compiles but does not link yet.
[env:house_esp32_loginonly]
# Bisection build, 2026-09-14: everything house_esp32 is EXCEPT CloudLink and the TLS library.
# If this joins WiFi and house_esp32 does not, the difference is in CloudLink/TLS; if neither
# joins, it is DirectAuth, the web-UI patches, or nothing in our code at all.
extends = env:house_esp32
custom_usermods = DirectAuth
lib_deps = ${esp32_idf_V4.lib_deps}
build_flags = ${env:house_esp32.build_flags} -D WLED_RELEASE_NAME=\"HOUSE_LOGINONLY\"

[env:house_esp32_debuglog]
# Real serial logs, 2026-09-14: Andrew has a terminal on the USB port. WLED_DEBUG turns on the
# DEBUG_PRINT* calls already throughout wled.cpp/network.cpp -- initConnection(), WiFiEvent(),
# handleConnection() -- which print exactly what the WiFi driver is doing (why a connect attempt
# failed, disconnect reason codes, when the AP comes up/down). LED outputs 2/3 (GPIO3/GPIO1) will
# misbehave while this is flashed, since they share pins with the serial port being watched --
# expected, and irrelevant to the WiFi question this build exists to answer.
extends = env:house_esp32_loginonly
build_flags = ${env:house_esp32_loginonly.build_flags} -D WLED_DEBUG -D WLED_RELEASE_NAME=\"HOUSE_DEBUGLOG\"
monitor_speed = 115200

[env:house_esp32_netlog]
# 2026-09-15: same WLED_DEBUG output as house_esp32_debuglog, but captured into a RAM ring buffer
# (wled00/net_ringlog.h) and served at GET /jts/log instead of requiring a serial cable -- this
# dev host has no network route straight to Andrew's LAN, so a UDP WLED_DEBUG_HOST listener here
# is not reachable either. Built on the FULL house_esp32 (CloudLink + TLS included), since that is
# what is currently being diagnosed. Once CloudLink actually connects, /jts/log is also reachable
# through the cloud's existing HTTP relay -- no serial cable and no direct LAN route needed at all.
extends = env:house_esp32
custom_usermods = DirectAuth CloudLink NetLog
build_flags = ${env:house_esp32.build_flags} -D WLED_DEBUG -D WLED_NET_RINGLOG -D WLED_RELEASE_NAME=\"HOUSE_NETLOG\"
