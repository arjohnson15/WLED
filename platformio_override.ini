# House-lights build environments (arjohnson15/WLED fork).
# This file is gitignored by upstream WLED and force-added here on purpose:
# platformio.ini stays byte-identical to upstream so `git merge upstream/main` is cheap.

[platformio]
default_envs = house_esp32

# Classic ESP32, 4 MB flash: upstream esp32dev plus the two house usermods.
#
# Platform: pioarduino (official arduino-esp32 3.x) instead of WLED's default Tasmota core.
# The Tasmota core strips the mbedtls TLS layer (no mbedtls_ssl_*, no WiFiClientSecure), so the
# cloud link's wss:// connection cannot link against it. pioarduino costs ~300 KB more flash.
#
# Partitions: 4MB_256KB_FS (1.8 MB app x2, 256 KB filesystem). Changing the partition table
# requires one flash over USB; OTA cannot do it.
[env:house_esp32]
extends = env:esp32dev
platform = ${esp32_idf_V5.platform_pioarduino}
platform_packages = ${esp32_idf_V5.platform_packages_pioarduino}
# Flash budget (measured 2026-09-05, slot = 1,900,544 bytes):
#   full esp32dev feature set + pioarduino + TLS          2,004,065  105%  does not fit
#   - audioreactive usermod, - infrared library           1,937,457  102%
#   - Hue sync, - Loxone, - Pixelforge, - 2D particles    1,863,425   98%  <- this config
#   additionally - Alexa, - 2D                            1,793,553   94%  (not applied)
# Dropped features are ones a house-lights strip install does not need. ~37 KB headroom
# is thin: if an upstream merge overflows, next candidates are WLED_DISABLE_ALEXA (~40 KB)
# and WLED_DISABLE_2D (~30 KB), or move to a board with 8/16 MB flash and switch
# board_build.partitions to ${esp32.large_partitions} / ${esp32.extreme_partitions}.
# Stubbing unused IDF libs (Bluetooth, provisioning) was tried and saved only ~11 KB:
# --gc-sections already discards them; linker-map size estimates were misleading.
custom_usermods = DirectAuth CloudLink
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags} -D WLED_RELEASE_NAME=\"HOUSE_ESP32\"
              -DARDUINO_USB_CDC_ON_BOOT=0
              -D WLED_DISABLE_INFRARED
              -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_LOXONE -D WLED_DISABLE_PIXELFORGE -D WLED_DISABLE_PARTICLESYSTEM2D
build_unflags = ${esp32_idf_V5.build_unflags} -D WLED_ENABLE_DMX_INPUT
board_build.partitions = ${esp32.big_partitions}
