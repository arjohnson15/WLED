# House-lights build environments (arjohnson15/WLED fork).
# This file is gitignored by upstream WLED and force-added here on purpose:
# platformio.ini stays byte-identical to upstream so `git merge upstream/main` is cheap.

[platformio]
default_envs = house_esp32

# Target: QuinLED Dig-Quad-AE v2 pre-assembled (QuinLED-ESP32 module, ESP32-WROOM-32E, external
# antenna, USB-C; 4 MB flash assumed - check
# Info -> Flash size after the first boot; a 16 MB module could use ${esp32.extreme_partitions}).
# Classic ESP32, 4 MB flash: upstream esp32dev plus the two house usermods.
#
# Platform: pioarduino (official arduino-esp32 3.x) instead of WLED's default Tasmota core.
# The Tasmota core strips the mbedtls TLS layer (no mbedtls_ssl_*, no WiFiClientSecure), so the
# cloud link's wss:// connection cannot link against it. pioarduino costs ~300 KB more flash.
#
# Partitions: 4MB_256KB_FS (1.8 MB app x2, 256 KB filesystem). Changing the partition table
# requires one flash over USB; OTA cannot do it.
# Diagnostic only, not for real use: identical Dig-Quad pin defaults and DirectAuth login as
# house_esp32, but built on IDF 4.4.8 (Tasmota Arduino Core 2.0.18) instead of IDF 5.5.4 — the
# same IDF major version QuinLED's own Dig-Quad-V3 firmware ships (confirmed by parsing the
# esp_app_desc_t header out of their actual released .bin, 2026-09-11), to test whether outputs
# 3/4 misbehaving on house_esp32 but not on QuinLED's firmware is really the IDF4->IDF5 RMT
# driver rewrite and not the wiring. No CloudLink: this Tasmota-lineage core has no TLS
# (mbedtls_ssl_* is stripped), which is the whole reason house_esp32 uses pioarduino/IDF5 for
# real use — this build exists only to answer one yes/no question about the LED outputs.
[env:house_esp32_v4test]
extends = env:esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
custom_usermods = DirectAuth
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"HOUSE_V4TEST\"
              -DARDUINO_USB_CDC_ON_BOOT=0
              -D WLED_DISABLE_INFRARED -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_LOXONE
              -D WLED_DISABLE_PARTICLESYSTEM2D -D WLED_DISABLE_ALEXA
              ;; identical QuinLED Dig-Quad v2/v3 first-boot defaults as house_esp32
              -D DATA_PINS=16,3,1,4 -D PIXEL_COUNTS=30,30,30,30 -D BTNPIN=0 -D RLYPIN=15
build_unflags = ${esp32_idf_V4.build_unflags} -D WLED_ENABLE_DMX_INPUT
lib_deps = ${esp32_idf_V4.lib_deps}
lib_ignore = ${esp32_idf_V4.lib_ignore}
board_build.partitions = ${esp32.default_partitions}

# Second diagnostic, 2026-09-11: house_esp32_v4test proved outputs 3/4 work correctly on IDF4 —
# now testing the other half of the equation. CloudLink's own header comment says it was written
# against ESP-IDF's esp-tls/esp_transport_ssl directly *because* the Arduino WiFiClientSecure
# wrapper is missing on this core, not because TLS itself is — which would mean it was already
# meant to work here and nobody has actually tried since. This either compiles and links, or it
# doesn't; either answer is useful and worth knowing before assuming the 2026-09-05 note
# ("Tasmota core has no TLS") still describes this exact platform release.
[env:house_esp32_v4cloudtest]
extends = env:house_esp32_v4test
custom_usermods = DirectAuth CloudLink

# Third diagnostic, same session: house_esp32_v4cloudtest above links fine right up until
# mbedtls_ssl_* itself -- Tasmota's own platform-espressif32 build genuinely omits those symbols
# from its precompiled libs (confirmed by a real link failure, not assumed from the 2026-09-05
# note). Testing whether that's a Tasmota-specific choice or true of IDF4.4.x generally, by
# swapping only the platform source to PlatformIO's own official espressif32 package at a
# similar IDF version (arduino-esp32 2.0.17 / esp-idf 4.4.7) -- same custom_usermods, same pins.
[env:house_esp32_v4cloudtest_official]
extends = env:house_esp32_v4cloudtest
platform = espressif32@ ~6.13.0
platform_packages =
board_build.partitions = ${esp32.big_partitions}   ;; links fine at 1.67MB; stock 1.5MB slot overflows by ~95KB

# 2026-09-11/12: the two diagnostics above answered both open questions -- outputs 3/4 are
# correct on IDF4, and (on the *official* espressif32 package, unlike Tasmota's own) CloudLink's
# TLS genuinely links and runs, confirmed with a real pairing+relay+OTA test on hardware. This
# became house_esp32 itself (see its definition below) rather than staying a separate candidate
# env, once the WiFi-scan bug it inherited from IDF4 was fixed (wled00/json.cpp, PATCHES.md).

[env:house_esp32]
extends = env:esp32dev
# 2026-09-12: house_esp32 was on pioarduino/IDF5.5.4 until this date. LED output 3 (GPIO1)
# misbehaved there (stuck white on some configurations) and two attempts to fix it in code
# while staying on IDF5 (releasing GPIO1/GPIO3 from UART0, at two different points in boot)
# both failed on real hardware. The official espressif32 platform at IDF4.4.7 (arduino-esp32
# 2.0.17) does not have this bug -- confirmed on real hardware, all 4 zones correct -- so this
# is now the platform, not a diagnostic candidate. It also has more flash headroom (87.3% vs
# IDF5's 98.4%) since it does not need pioarduino's extra ~300 KB. Its one real downside, a
# WiFi-scan-breaks-after-a-failed-connection bug (arduino-esp32 #8916, confirmed on every IDF4
# package tried, no version bump fixes it), is fixed in wled00/json.cpp -- see PATCHES.md.
platform = espressif32@ ~6.13.0
platform_packages =
# Flash budget (measured 2026-09-12, slot = 1,900,544 bytes): 1,659,605 = 87.3%.
# Alexa costs ~17 KB and was measured on 2026-09-08 (against the old IDF5 build) at 99.3% of
# the app slot -- too little to survive a weekly upstream merge -- so it stays off by default,
# not because it does not work. Removing the flag below is the whole change if it is ever
# wanted; there is more headroom for it here than there was on IDF5.
custom_usermods = DirectAuth CloudLink
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"HOUSE_ESP32\"
              -DARDUINO_USB_CDC_ON_BOOT=0
              -D WLED_DISABLE_INFRARED
              -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_LOXONE -D WLED_DISABLE_PIXELFORGE -D WLED_DISABLE_PARTICLESYSTEM2D
              -D WLED_DISABLE_ALEXA
              -D JTS_BUILD='"${UNIX_TIME}"'   ;; build id reported to the cloud, used to compare releases
              ;; QuinLED Dig-Quad v2/v3 first-boot defaults (all runtime-changeable in LED settings):
              ;; LED1=GPIO16 LED2=GPIO3 LED3=GPIO1 LED4=GPIO4, button=GPIO0, Q1R strip-power relay=GPIO15
              ;; (fitted on pre-assembled boards such as Andrew's Dig-Quad-AE v2; set -1 in the UI on a DIY board).
              ;; Temp sensor is GPIO13 (Temperature usermod, not included).
              -D DATA_PINS=16,3,1,4 -D PIXEL_COUNTS=30,30,30,30 -D BTNPIN=0 -D RLYPIN=15
build_unflags = ${esp32_idf_V4.build_unflags} -D WLED_ENABLE_DMX_INPUT
lib_deps = ${esp32_idf_V4.lib_deps}
lib_ignore = ${esp32_idf_V4.lib_ignore}
board_build.partitions = ${esp32.big_partitions}
# pioarduino auto-generated firmware.factory.bin; the official espressif32 package does not,
# so this replaces it -- both the panel's USB-image button and jts-firmware.yml need that file.
extra_scripts = ${scripts_defaults.extra_scripts}
  post:tools/jts-merge-factory.py

# OTA-able intermediate build: stock WLED core and stock 4MB_1MB_FS partitions (1.5 MB app slot),
# plus DirectAuth only. Fits through WLED's normal /update page on a controller that still runs the
# stock layout, and keeps its config (same filesystem). No cloud link: TLS does not fit the stock
# slot and the Tasmota core has no TLS. Use it to test the login layer before the USB flash.
[env:house_esp32_ota]
extends = env:esp32dev
custom_usermods = DirectAuth
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags} -D WLED_RELEASE_NAME=\"HOUSE_ESP32_OTA\"
              -DARDUINO_USB_CDC_ON_BOOT=0
              -D WLED_DISABLE_ALEXA -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_LOXONE
board_build.partitions = ${esp32.default_partitions}
